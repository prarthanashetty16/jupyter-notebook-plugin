name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history and tags: the freeze-guard tests compare with the current frozen tag
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,bench]"
      - run: ruff check .
      - run: ruff format . --check

  test:
    # Supported for measurement and the models (Phase 7d): pandas >= 3.1 (Python >= 3.11) on Windows and Linux.
    # Python 3.10 resolves pandas 2.x, on which the copy-on-write mechanisms the models and the instrument's
    # validation assume do not hold: those jobs are REPORT-ONLY (continue-on-error). On macOS the instrument
    # cannot isolate an operation's peak (a copy was censored in CI): its validation step is report-only
    # there, the rest of the suite is required.
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})${{ matrix.python == '3.10' && ' [report-only, pandas 2.x unsupported]' || '' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python == '3.10' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history and tags: the freeze-guard tests compare with the current frozen tag
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,bench]"
      - name: Machine info
        run: python -c "import platform, psutil, numpy, pandas; print(platform.platform(), psutil.cpu_count(), psutil.virtual_memory().total >> 20, 'MiB', numpy.__version__, pandas.__version__)"
      - name: Instrument validation (known allocations within +/-10%)
        continue-on-error: ${{ matrix.os == 'macos-latest' || matrix.python == '3.10' }}
        run: pytest tests/test_measure_validation.py -v
      - name: Remaining tests
        run: pytest --ignore=tests/test_measure_validation.py

  pandas-mechanisms:
    # The model terms that depend on pandas internals (merge left-copy elision, concat of
    # categoricals, sorted uniques, read_csv dates as text, hash-table working set and page
    # residency) are checked per pandas version. Only the version the calibration artifact was
    # fitted on is validated; the others are informational (continue-on-error) and no result is
    # claimed for a version unless this job actually ran for it.
    name: pandas mechanisms (pandas ${{ matrix.pandas }}, Python ${{ matrix.python }})${{ matrix.validated != true && ' [informational]' || '' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.validated != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pandas: "2.0.3", numpy: "1.26.4", python: "3.11"}
          - {pandas: "2.1.4", numpy: "1.26.4", python: "3.11"}
          - {pandas: "2.2.3", numpy: "2.1.3", python: "3.12"}
          - {pandas: "3.0.*", numpy: "2.*", python: "3.12"}
          - {pandas: "3.1.1", numpy: "2.5.5", python: "3.12", validated: true}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history and tags: the freeze-guard tests compare with the current frozen tag
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pip install "pandas==${{ matrix.pandas }}" "numpy==${{ matrix.numpy }}"
      - run: python -c "import pandas, numpy; print(pandas.__version__, numpy.__version__)"
      - run: pytest -m pandas_mechanisms tests/test_pandas_mechanisms.py -v
