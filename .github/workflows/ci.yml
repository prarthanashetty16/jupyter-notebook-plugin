name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,bench]"
      - run: ruff check .
      - run: ruff format . --check

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,bench]"
      - name: Machine info
        run: python -c "import platform, psutil, numpy, pandas; print(platform.platform(), psutil.cpu_count(), psutil.virtual_memory().total >> 20, 'MiB', numpy.__version__, pandas.__version__)"
      - name: Instrument validation (known allocations within +/-10%)
        run: pytest tests/test_measure_validation.py -v
      - name: Remaining tests
        run: pytest --ignore=tests/test_measure_validation.py
